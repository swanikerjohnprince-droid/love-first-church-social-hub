services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lfc_social_hub
      POSTGRES_USER: lfc
      POSTGRES_PASSWORD: lfc_dev_password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfc -d lfc_social_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: ["redis-server", "--appendonly", "yes"]
volumes:
  postgres_data:
  redis_data:
